[package]
name = "config"
version = "0.1.0"
edition = "2024"

[lib]
name = "config"

[[bench]]
name = "display_join"
harness = false

[[bench]]
name = "parse"
harness = false

[dependencies]
bytes = "1.12"
config_derive = { path = "../config-derive" }
lex_token_derive = { path = "../lex-token-derive" }
display_as_debug_derive = { path = "../display-as-debug-derive" }
regex = "1.13"
regex-automata = "0.4"
regex-syntax = "0.8"
thiserror = "2.0"

[dev-dependencies]
criterion = "0.8"
itertools = "0.15"
proptest = "1.12"
proptest-derive = "0.9"
rand = "0.10"
rstest = "0.27"
walkdir = "2.5"
